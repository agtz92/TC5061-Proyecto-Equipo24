# Entorno de `mlflow run`. Mismas versiones fijas que requirements.txt
# (tests/test_env.py verifica que coincidan). Se omiten herramientas de desarrollo
# (jupyterlab, ipykernel, ruff, pytest); el módulo mibici se importa desde la raíz.
python: "3.12"
build_dependencies:
  - pip
dependencies:
  - requests==2.32.3
  - pandas==2.2.3
  - numpy==2.2.5
  - pyarrow==19.0.1
  - duckdb==1.2.2
  - scikit-learn==1.6.1
  - mlflow==2.22.0
  - sqlalchemy==2.0.40
  - matplotlib==3.10.1
  - typer==0.15.2
  - loguru==0.7.3
  - python-dotenv==1.1.0
  - tqdm==4.67.1
